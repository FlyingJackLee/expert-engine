[project]
name = "expert-engine"
version = "0.1.0"
description = "Evidence-grounded industry opportunity analysis engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "langgraph>=0.2,<1.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "openai>=1.0,<3.0",
  "pydantic>=2.8,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph-checkpoint-postgres>=3.0.5",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
