services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: expert_engine
      POSTGRES_USER: expert_engine
      POSTGRES_PASSWORD: expert_engine
    ports:
      # 5432 is commonly occupied by a host-installed PostgreSQL instance.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expert_engine -d expert_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
